name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.github/workflows/**'
      - 'repo.json'
      - 'DomainCheck.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "out"

      - name: Clean old builds
        run: rm -f out/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Create TMDB config
        run: |
          mkdir -p Flixlatam/src/main/kotlin/com/byayzen/
          cat > Flixlatam/src/main/kotlin/com/byayzen/TmdbConfig.kt << EOF
          package com.byayzen

          internal const val TMDB_API_KEY = "${{ secrets.TMDB_API_KEY }}"
          EOF
          
      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon
          cp **/build/*.cs3 out/ || true
          cp build/plugins.json out/ || true

      - name: Push builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push origin builds
